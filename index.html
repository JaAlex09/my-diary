<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的日记</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f6f1e7; color: #33302a; line-height: 1.6; font-size: 17px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,253,248,.96); backdrop-filter: blur(8px); border-top: 1px solid #e8dfcc; padding-bottom: env(safe-area-inset-bottom); }
  .bottom-nav-inner { max-width: 640px; margin: 0 auto; display: flex; }
  .nav-btn { flex: 1; min-height: 64px; border: 0; background: transparent; font-size: 13px; color: #8a8378; cursor: pointer; padding: 8px 4px 10px; }
  .nav-btn .nav-icon { display: block; font-size: 22px; line-height: 1.2; }
  .nav-btn.active { color: #b7793f; font-weight: 600; }
  header { text-align: center; padding: 14px 0 6px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: 4px; }
  header p { margin: 6px 0 0; color: #8a8378; font-size: 14px; }
  .privacy { background: #fff8e6; border: 1px solid #ead9a8; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #7a6a3f; margin: 12px 0; }
  .countdown { background: #33302a; color: #fff; border-radius: 16px; padding: 16px; text-align: center; margin-top: 12px; }
  .countdown .days { font-size: 42px; font-weight: 700; line-height: 1.1; color: #ffd479; }
  .countdown .label { font-size: 15px; margin-top: 2px; }
  .countdown .date { font-size: 13px; color: #c9c0ae; margin-top: 4px; }
  .card { background: #fffdf8; border: 1px solid #e8dfcc; border-radius: 16px; padding: 16px; margin-top: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 8px; flex: 1; }
  .tab { flex: 1; min-height: 46px; border: 1px solid #ddd2bd; background: #fff; color: #555; border-radius: 999px; padding: 10px 12px; font-size: 16px; cursor: pointer; }
  .tab.active { background: #33302a; color: #fff; border-color: #33302a; }
  .btn { min-height: 46px; border: 1px solid #ddd2bd; background: #fff; color: #333; border-radius: 12px; padding: 11px 16px; font-size: 16px; cursor: pointer; }
  .btn.primary { background: #b7793f; border-color: #b7793f; color: #fff; }
  .btn.danger { background: #fff; color: #b3261e; border-color: #e5b8b4; }
  .btn:disabled { opacity: .5; cursor: default; }
  .search { flex: 1; min-width: 180px; min-height: 46px; padding: 11px 14px; border: 1px solid #ddd2bd; border-radius: 12px; font-size: 16px; background: #fff; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-head h2 { margin: 0; font-size: 20px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-week { text-align: center; font-size: 13px; color: #9a917f; padding: 4px 0; }
  .cal-day { min-height: 58px; border: 1px solid #eee5d0; border-radius: 12px; background: #fff; padding: 6px 4px; cursor: pointer; text-align: center; font-size: 16px; }
  .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-day.today { border-color: #b7793f; box-shadow: 0 0 0 1px #b7793f inset; }
  .cal-day.selected { background: #33302a; color: #fff; }
  .cal-day.selected .dot { background: #ffd479; }
  .cal-day .dot { width: 8px; height: 8px; border-radius: 50%; background: #b7793f; display: block; margin: 6px auto 0; }
  .cal-day .mood { display: none; }
  .cal-day.selected .mood { color: #e8dfcc; }
  label { display: block; font-size: 14px; color: #7a7264; margin: 12px 0 6px; }
  input[type="date"], input[type="text"], input[type="url"] { width: 100%; min-height: 48px; padding: 12px; border: 1px solid #ddd2bd; border-radius: 12px; font-size: 17px; background: #fff; }
  .music-item { border: 1px solid #eee5d0; border-radius: 12px; background: #fff; padding: 12px; margin-top: 10px; }
  .music-item iframe { width: 100%; height: 66px; border: 0; border-radius: 8px; margin-top: 8px; display: block; }
  .music-item a { color: #b7793f; word-break: break-all; }
  .music-item .music-title { font-weight: 600; font-size: 16px; }
  textarea { width: 100%; min-height: 280px; padding: 14px; border: 1px solid #ddd2bd; border-radius: 12px; font-size: 17px; line-height: 1.8; background: #fff; resize: vertical; }
  .moods { display: flex; gap: 8px; flex-wrap: wrap; }
  .mood-btn { min-height: 44px; border: 1px solid #ddd2bd; background: #fff; border-radius: 999px; padding: 9px 15px; font-size: 15px; cursor: pointer; }
  .editor-actions { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); background: #fffdf8; padding: 12px 0 4px; margin-top: 14px; }
  .mood-btn.active { background: #33302a; color: #fff; border-color: #33302a; }
  .meta { font-size: 13px; color: #9a917f; }
  .entry { border: 1px solid #eee5d0; border-radius: 12px; background: #fff; padding: 14px; margin-top: 10px; cursor: pointer; }
  .entry h3 { margin: 0 0 4px; font-size: 17px; }
  .entry p { margin: 4px 0 0; color: #6b655a; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty-tip { text-align: center; color: #9a917f; padding: 28px 0 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #33302a; color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 15px; display: none; z-index: 30; max-width: 90vw; text-align: center; }
  footer { text-align: center; color: #9a917f; font-size: 13px; margin-top: 24px; }
  @media (min-width: 601px) { .wrap { max-width: 640px; } .cal-day .mood { display: block; font-size: 12px; color: #8a8378; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cal-day.selected .mood { color: #e8dfcc; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的日记</h1>
    <p id="todayLine"></p>
  </header>

  <div class="countdown">
    <div class="label">距高考还有</div>
    <div class="days"><span id="countdownDays">—</span> 天</div>
    <div class="date">高考 · 2027年6月7日</div>
  </div>

  <div class="card" id="calendarCard" style="display:none;">
    <div class="cal-head">
      <button class="btn" id="prevMonth" type="button">‹ 上月</button>
      <h2 id="monthTitle"></h2>
      <button class="btn" id="nextMonth" type="button">下月 ›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="meta" style="margin: 12px 0 0;">点一个日期，就能写那天的日记；有小圆点的日期是已经写过的。</p>
  </div>

  <div class="card" id="listCard" style="display:none;">
    <input class="search" id="searchInput" type="text" placeholder="搜索标题、内容或歌名…">
    <div id="listBox"></div>
  </div>

  <div class="card" id="backupCard" style="display:none;">
    <h2 style="margin:0 0 8px;">备份</h2>
    <p class="meta" id="statsLine" style="margin:0 0 12px;"></p>
    <p class="meta" style="margin:0 0 12px;">日记只存在这台手机的浏览器里。换手机或清数据前，先导出一份备份文件留着。</p>
    <div class="row">
      <button class="btn" id="exportBtn" type="button" style="flex:1;">导出备份</button>
      <button class="btn" id="importBtn" type="button" style="flex:1;">导入备份</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </div>

  <div class="card" id="editorCard">
    <h2 style="margin:0;" id="editorTitle">写日记</h2>
    <label for="dateInput">日期</label>
    <input type="date" id="dateInput">
    <label for="titleInput">标题（可不填）</label>
    <input type="text" id="titleInput" placeholder="给今天起个标题…">
    <label>今天的心情</label>
    <div class="moods" id="moodBox">
      <button type="button" class="mood-btn" data-mood="😊 开心">😊 开心</button>
      <button type="button" class="mood-btn" data-mood="😐 平静">😐 平静</button>
      <button type="button" class="mood-btn" data-mood="😢 难过">😢 难过</button>
      <button type="button" class="mood-btn" data-mood="😴 很累">😴 很累</button>
      <button type="button" class="mood-btn" data-mood="🤩 兴奋">🤩 兴奋</button>
    </div>
    <label for="contentInput">内容</label>
    <textarea id="contentInput" placeholder="今天发生了什么，想说什么就写什么…"></textarea>
    <label>🎵 今日音乐</label>
    <p class="meta" style="margin: 0 0 8px;">粘贴歌曲链接就能记下来，一天可以加好几首。网易云和 Spotify 会直接显示播放器，其他链接点开听。</p>
    <input type="url" id="musicUrlInput" placeholder="粘贴歌曲链接，例如网易云分享链接…" inputmode="url">
    <div style="height:8px"></div>
    <input type="text" id="musicTitleInput" placeholder="歌名（可不填）">
    <div style="height:8px"></div>
    <input type="text" id="musicArtistInput" placeholder="歌手（可不填）">
    <div style="height:10px"></div>
    <button class="btn" id="addMusicBtn" type="button" style="width:100%;">＋ 添加这首歌</button>
    <div id="musicList"></div>
    <div class="row editor-actions">
      <span class="meta" id="countLine"></span>
      <span style="flex:1"></span>
      <button class="btn danger" id="deleteBtn" type="button">删除这篇</button>
      <button class="btn primary" id="saveBtn" type="button" style="flex:1; min-width: 140px;">保存</button>
    </div>
    <p class="meta" id="savedLine" style="margin: 10px 0 0;"></p>
  </div>

  <footer>每天一篇，写给自己看。</footer>
</div>
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" id="navDiary" type="button"><span class="nav-icon">✍️</span>写日记</button>
    <button class="nav-btn" id="navCalendar" type="button"><span class="nav-icon">📅</span>日历</button>
    <button class="nav-btn" id="navList" type="button"><span class="nav-icon">📖</span>列表</button>
    <button class="nav-btn" id="navBackup" type="button"><span class="nav-icon">💾</span>备份</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = 'my-diary-v1';
  var entries = {};
  try { entries = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { entries = {}; }

  var today = new Date();
  var todayStr = toDateStr(today);
  var viewMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  var selectedDate = todayStr;
  var selectedMood = '';
  var currentMusic = [];
  var currentView = 'diary';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function saveAll() { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) { toast('保存失败：浏览器存储空间不足'); } }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(function () { t.style.display = 'none'; }, 2200); }
  function parseMusicUrl(url) {
    var m = url.match(/music\.163\.com\/(?:#\/)?song\?id=(\d+)/) || url.match(/y\.music\.163\.com\/m\/song\?id=(\d+)/) || url.match(/[?&]id=(\d+)/);
    if (/music\.163\.com|y\.music\.163\.com/.test(url) && m) return { platform: '网易云音乐', id: m[1] };
    var s = url.match(/open\.spotify\.com\/track\/([A-Za-z0-9]+)/);
    if (s) return { platform: 'Spotify', id: s[1] };
    return { platform: '链接', id: '' };
  }
  function musicEmbedUrl(song) {
    if (song.platform === '网易云音乐' && song.id) return 'https://music.163.com/outchain/player?type=2&id=' + song.id + '&auto=0&height=66';
    if (song.platform === 'Spotify' && song.id) return 'https://open.spotify.com/embed/track/' + song.id;
    return '';
  }
  function renderMusic() {
    var box = document.getElementById('musicList');
    box.innerHTML = '';
    currentMusic.forEach(function (song, idx) {
      var div = document.createElement('div');
      div.className = 'music-item';
      var name = song.title || song.platform || '歌曲';
      var sub = [song.artist || '', song.platform || ''].filter(Boolean).join(' · ');
      var embed = musicEmbedUrl(song);
      div.innerHTML = '<div class="music-title">🎵 ' + esc(name) + '</div>' +
        (sub ? '<div class="meta">' + esc(sub) + '</div>' : '') +
        '<a href="' + esc(song.url) + '" target="_blank" rel="noopener">打开歌曲链接 ↗</a>' +
        (embed ? '<iframe src="' + esc(embed) + '" loading="lazy" allow="autoplay; encrypted-media"></iframe>' : '');
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'btn danger'; del.style.marginTop = '8px'; del.textContent = '移除这首';
      del.addEventListener('click', function () { currentMusic.splice(idx, 1); renderMusic(); });
      div.appendChild(del);
      box.appendChild(div);
    });
  }

  function renderCountdown() {
    var target = new Date(2027, 5, 7);
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var days = Math.round((target - now) / 86400000);
    var el = document.getElementById('countdownDays');
    if (days > 0) el.textContent = days;
    else if (days === 0) el.textContent = '0';
    else el.textContent = '已结束';
    document.querySelector('.countdown .label').textContent = days === 0 ? '今天就是高考' : (days < 0 ? '高考已经过去' : '距高考还有');
  }

  function renderStats() {
    var keys = Object.keys(entries);
    var thisMonth = keys.filter(function (k) { return k.slice(0, 7) === toDateStr(viewMonth).slice(0, 7); }).length;
    document.getElementById('statsLine').textContent = '共写了 ' + keys.length + ' 篇 · 本月 ' + thisMonth + ' 篇';
    document.getElementById('todayLine').textContent = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日 · ' + ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][today.getDay()];
  }

  function renderCalendar() {
    var y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    document.getElementById('monthTitle').textContent = y + '年' + (m + 1) + '月';
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['日','一','二','三','四','五','六'].forEach(function (w) {
      var c = document.createElement('div'); c.className = 'cal-week'; c.textContent = w; grid.appendChild(c);
    });
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < first; i++) { var e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e); }
    for (var d = 1; d <= days; d++) {
      (function (d) {
        var ds = y + '-' + pad(m + 1) + '-' + pad(d);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cal-day' + (ds === todayStr ? ' today' : '') + (ds === selectedDate ? ' selected' : '');
        var html = '<span>' + d + '</span>';
        if (entries[ds]) { html += '<span class="dot"></span>'; if (entries[ds].mood) html += '<span class="mood">' + esc(entries[ds].mood) + '</span>'; }
        btn.innerHTML = html;
        btn.addEventListener('click', function () { selectDate(ds); setView('diary'); });
        grid.appendChild(btn);
      })(d);
    }
  }

  function renderList() {
    var q = (document.getElementById('searchInput').value || '').trim();
    var box = document.getElementById('listBox');
    var keys = Object.keys(entries).sort().reverse().filter(function (k) {
      if (!q) return true;
      var en = entries[k];
      var musicText = (en.music || []).map(function (s) { return (s.title || '') + ' ' + (s.artist || ''); }).join(' ');
      return (en.title || '').indexOf(q) !== -1 || (en.content || '').indexOf(q) !== -1 || musicText.indexOf(q) !== -1;
    });
    if (!keys.length) { box.innerHTML = '<p class="empty-tip">' + (q ? '没有找到相关日记' : '还没有日记，点「写今天的日记」开始第一篇吧') + '</p>'; return; }
    box.innerHTML = '';
    keys.forEach(function (k) {
      var en = entries[k];
      var div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = '<h3>' + esc(en.title || '无标题') + '</h3><div class="meta">' + esc(k) + (en.mood ? ' · ' + esc(en.mood) : '') + ((en.music && en.music.length) ? ' · 🎵 ' + en.music.length + ' 首' : '') + '</div><p>' + esc(en.content || '') + '</p>';
      div.addEventListener('click', function () { selectDate(k); setView('diary'); });
      box.appendChild(div);
    });
  }

  function selectDate(ds) {
    selectedDate = ds;
    var en = entries[ds] || { date: ds, title: '', mood: '', content: '' };
    document.getElementById('dateInput').value = ds;
    document.getElementById('titleInput').value = en.title || '';
    document.getElementById('contentInput').value = en.content || '';
    selectedMood = en.mood || '';
    currentMusic = (en.music || []).slice();
    renderMusic();
    document.querySelectorAll('.mood-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-mood') === selectedMood); });
    document.getElementById('editorTitle').textContent = entries[ds] ? '编辑 ' + ds + ' 的日记' : '写 ' + ds + ' 的日记';
    document.getElementById('deleteBtn').style.display = entries[ds] ? '' : 'none';
    document.getElementById('savedLine').textContent = en.updatedAt ? '上次保存：' + en.updatedAt : '';
    updateCount();
    renderCalendar();
  }

  function updateCount() {
    var v = document.getElementById('contentInput').value || '';
    document.getElementById('countLine').textContent = v.length + ' 字';
  }

  function setView(v) {
    currentView = v;
    document.getElementById('navDiary').classList.toggle('active', v === 'diary');
    document.getElementById('navCalendar').classList.toggle('active', v === 'calendar');
    document.getElementById('navList').classList.toggle('active', v === 'list');
    document.getElementById('navBackup').classList.toggle('active', v === 'backup');
    document.getElementById('editorCard').style.display = v === 'diary' ? '' : 'none';
    document.getElementById('calendarCard').style.display = v === 'calendar' ? '' : 'none';
    document.getElementById('listCard').style.display = v === 'list' ? '' : 'none';
    document.getElementById('backupCard').style.display = v === 'backup' ? '' : 'none';
    if (v === 'calendar') renderCalendar();
    if (v === 'list') renderList();
    if (v === 'backup') renderStats();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('navDiary').addEventListener('click', function () { setView('diary'); });
  document.getElementById('navCalendar').addEventListener('click', function () { setView('calendar'); });
  document.getElementById('navList').addEventListener('click', function () { setView('list'); });
  document.getElementById('navBackup').addEventListener('click', function () { setView('backup'); });
  document.getElementById('prevMonth').addEventListener('click', function () { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); renderCalendar(); renderStats(); });
  document.getElementById('nextMonth').addEventListener('click', function () { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); renderCalendar(); renderStats(); });
  document.getElementById('dateInput').addEventListener('change', function () { if (this.value) selectDate(this.value); });
  document.getElementById('contentInput').addEventListener('input', updateCount);
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.querySelectorAll('.mood-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      selectedMood = (selectedMood === b.getAttribute('data-mood')) ? '' : b.getAttribute('data-mood');
      document.querySelectorAll('.mood-btn').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-mood') === selectedMood); });
    });
  });

  document.getElementById('addMusicBtn').addEventListener('click', function () {
    var url = document.getElementById('musicUrlInput').value.trim();
    if (!url) { toast('先粘贴歌曲链接'); return; }
    if (!/^https?:\/\//i.test(url)) { toast('链接要以 http 开头'); return; }
    var parsed = parseMusicUrl(url);
    currentMusic.push({ url: url, title: document.getElementById('musicTitleInput').value.trim(), artist: document.getElementById('musicArtistInput').value.trim(), platform: parsed.platform, id: parsed.id });
    document.getElementById('musicUrlInput').value = '';
    document.getElementById('musicTitleInput').value = '';
    document.getElementById('musicArtistInput').value = '';
    renderMusic();
    toast('已添加，记得点保存');
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    var ds = document.getElementById('dateInput').value || todayStr;
    var content = document.getElementById('contentInput').value.trim();
    var title = document.getElementById('titleInput').value.trim();
    if (!content && !title && !currentMusic.length) { toast('先写点内容或加首歌再保存'); return; }
    entries[ds] = { date: ds, title: title, mood: selectedMood, content: content, music: currentMusic.slice(), updatedAt: new Date().toLocaleString('zh-CN') };
    saveAll();
    toast('已保存到这台设备');
    selectDate(ds);
    renderStats();
    if (currentView === 'list') renderList();
  });

  document.getElementById('deleteBtn').addEventListener('click', function () {
    var ds = document.getElementById('dateInput').value;
    if (!entries[ds]) return;
    if (!confirm('确定删除 ' + ds + ' 这篇日记吗？删了就找不回来了。')) return;
    delete entries[ds];
    saveAll();
    toast('已删除');
    selectDate(ds);
    renderStats();
    if (currentView === 'list') renderList();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var data = JSON.stringify({ app: 'my-diary', version: 1, exportedAt: new Date().toISOString(), entries: entries }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'diary-backup-' + todayStr + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('备份文件已下载');
  });

  document.getElementById('importBtn').addEventListener('click', function () { document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var incoming = data.entries || data;
        if (typeof incoming !== 'object' || incoming === null) throw new Error('格式不对');
        var count = 0;
        Object.keys(incoming).forEach(function (k) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && incoming[k] && typeof incoming[k].content === 'string') { entries[k] = incoming[k]; count++; }
        });
        if (!count) { toast('备份里没有可导入的日记'); return; }
        saveAll();
        toast('已导入 ' + count + ' 篇');
        selectDate(selectedDate); renderStats(); if (currentView === 'list') renderList();
      } catch (e) { toast('导入失败：不是有效的备份文件'); }
    };
    reader.readAsText(file);
    this.value = '';
  });

  renderCountdown();
  renderStats();
  renderCalendar();
  selectDate(todayStr);
})();
</script>
</body>
</html>
